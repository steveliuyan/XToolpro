<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>字体与间距</title><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body)}main{max-width:850px;margin:auto;padding:36px 20px}h1{font:690 30px/1.15 var(--font-display)}h2{font:670 17px/1.25 var(--font-display);margin-top:28px}.meta,.eyebrow{font-family:var(--font-mono);color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.08em}.storage{font:650 46px/.95 var(--font-mono);letter-spacing:-.06em}.scale{display:grid;gap:9px}.row{display:flex;align-items:center;gap:14px}.bar{height:14px;background:var(--accent);border-radius:4px}.w1{width:var(--space-1)}.w2{width:var(--space-2)}.w3{width:var(--space-3)}.w4{width:var(--space-4)}.w5{width:var(--space-5)}.w6{width:var(--space-6)}.w7{width:var(--space-7)}.w8{width:var(--space-8)}</style></head><body><main data-od-id="type-spacing-preview"><p class="eyebrow">TYPE / SPACE REVIEW</p><h1 data-od-id="type-title">存储管理，保持清晰</h1><p>正文 14px / 1.45，系统字体优先保证移动端阅读稳定。</p><h2>等宽数据</h2><div class="storage">38.6 <small class="meta">GB</small></div><p class="meta">已使用 84.2 GB / 122.8 GB · 09:41</p><h2>4px 间距尺度</h2><section class="scale" data-od-id="spacing-scale"><div class="row"><span class="meta">04</span><i class="bar w1"></i></div><div class="row"><span class="meta">08</span><i class="bar w2"></i></div><div class="row"><span class="meta">12</span><i class="bar w3"></i></div><div class="row"><span class="meta">16</span><i class="bar w4"></i></div><div class="row"><span class="meta">20</span><i class="bar w5"></i></div><div class="row"><span class="meta">24</span><i class="bar w6"></i></div><div class="row"><span class="meta">28</span><i class="bar w7"></i></div><div class="row"><span class="meta">32</span><i class="bar w8"></i></div></section></main></body></html>
