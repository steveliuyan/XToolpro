<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>颜色与状态</title><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body)}main{max-width:850px;margin:auto;padding:36px 20px}h1{font:690 30px/1.15 var(--font-display)}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:24px}.swatch{min-height:124px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:end;font:12px var(--font-mono)}.bg{background:var(--bg)}.surface{background:var(--surface)}.fg{background:var(--fg);color:var(--surface)}.muted{background:var(--muted);color:var(--surface)}.accent{background:var(--accent);color:var(--surface)}.success{background:var(--success);color:var(--fg)}.warn{background:var(--warn);color:var(--fg)}.danger{background:var(--danger);color:var(--surface)}.states{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}button{min-height:44px;padding:0 16px;border-radius:8px;font:650 13px var(--font-body);cursor:pointer}.primary{border:1px solid var(--accent);background:var(--accent);color:var(--surface)}.primary:hover{background:color-mix(in oklch,var(--accent) 88%,black)}.secondary{border:1px solid var(--border);background:var(--surface);color:var(--fg)}.secondary:hover{border-color:var(--accent);background:var(--accent-soft)}button:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 35%,transparent);outline-offset:2px}</style></head><body><main data-od-id="color-preview"><p>COLOR / TOKEN REVIEW</p><h1 data-od-id="color-title">基础色与状态</h1><p>天空蓝只承担操作、选中、连接和进行中的意义。</p><section class="grid" data-od-id="color-swatches"><div class="swatch bg">--bg</div><div class="swatch surface">--surface</div><div class="swatch fg">--fg</div><div class="swatch muted">--muted</div><div class="swatch accent">--accent</div><div class="swatch success">--success</div><div class="swatch warn">--warn</div><div class="swatch danger">--danger</div></section><section class="states" data-od-id="button-states"><button class="primary">开始处理</button><button class="secondary">查看详情</button></section></main></body></html>
