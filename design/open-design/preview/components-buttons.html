<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>按钮组件</title><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body)}main{max-width:620px;margin:auto;padding:36px 20px}h1{font:690 30px/1.15 var(--font-display)}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button{min-height:44px;padding:0 16px;border-radius:var(--radius);font-weight:670;cursor:pointer}.primary{border:1px solid var(--accent);background:var(--accent);color:var(--surface)}.secondary{border:1px solid var(--border);background:var(--surface);color:var(--fg)}button:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 40%,transparent);outline-offset:2px}</style></head><body><main data-od-id="button-preview"><p>COMPONENT / BUTTONS</p><h1 data-od-id="button-title">主次操作</h1><div class="row"><button class="primary" data-od-id="primary-button">开始处理</button><button class="secondary" data-od-id="secondary-button">取消</button></div></main></body></html>
