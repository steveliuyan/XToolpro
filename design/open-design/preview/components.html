<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>组件行为</title><link rel="stylesheet" href="../colors_and_type.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body)}main{max-width:850px;margin:auto;padding:36px 20px}h1{margin:0;font:690 30px/1.15 var(--font-display)}.meta{color:var(--muted);font:12px/1.4 var(--font-mono)}.list{margin-top:24px;border-top:1px solid var(--border)}.row{display:flex;align-items:center;gap:13px;min-height:64px;border-bottom:1px solid var(--border)}.symbol{display:grid;width:35px;height:35px;place-items:center;border-radius:8px;background:var(--accent-icon);color:var(--accent);font-weight:700}.copy{flex:1}.action{min-width:44px;height:44px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--fg);cursor:pointer}.action:hover{border-color:var(--accent);background:var(--accent-soft)}.action:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 40%,transparent);outline-offset:2px}.progress{height:5px;margin-top:8px;overflow:hidden;border-radius:99px;background:color-mix(in oklch,var(--fg) 8%,var(--surface))}.progress i{display:block;width:56%;height:100%;background:var(--accent)}.switch{width:52px;height:32px;border:1px solid var(--accent);border-radius:20px;background:var(--accent-soft);position:relative}.switch:after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--accent)}</style></head><body><main data-od-id="component-preview"><p class="meta">COMPONENT / BEHAVIOR REVIEW</p><h1 data-od-id="component-title">任务与设置组件</h1><section class="list"><article class="row" data-od-id="task-row-preview"><span class="symbol">下</span><div class="copy"><strong>公开链接媒体下载</strong><p class="meta">下载中 · 720p MP4 · 56%</p><div class="progress"><i></i></div></div><button class="action" aria-label="暂停下载">停</button></article><article class="row" data-od-id="setting-row-preview"><span class="symbol">铃</span><div class="copy"><strong>后台任务通知</strong><p class="meta">显示下载、扫描和导出进度</p></div><button class="switch" role="switch" aria-checked="true" aria-label="后台任务通知已开启"></button></article></section></main></body></html>
