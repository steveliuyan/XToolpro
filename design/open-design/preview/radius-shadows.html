<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>形状与层级</title><link rel="stylesheet" href="../colors_and_type.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body)}main{max-width:850px;margin:auto;padding:36px 20px}h1{margin:0;font:690 30px/1.15 var(--font-display)}.meta{color:var(--muted);font:12px/1.4 var(--font-mono)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:24px}.sample{min-height:150px;padding:16px;border:1px solid var(--border);background:var(--surface)}.r8{border-radius:var(--radius)}.r10{border-radius:var(--radius-panel)}.r12{border-radius:12px;box-shadow:var(--shadow)}.track{height:9px;margin-top:22px;border-radius:99px;background:color-mix(in oklch,var(--fg) 8%,var(--surface))}.track i{display:block;width:68%;height:100%;border-radius:inherit;background:var(--accent)}</style></head><body><main data-od-id="shape-preview"><p class="meta">SHAPE / ELEVATION REVIEW</p><h1 data-od-id="shape-title">圆角与层级</h1><p class="meta">常规内容依靠细边框和留白组织，仅对确认对话框使用提升层级。</p><section class="grid"><article class="sample r8" data-od-id="radius-card"><strong>8px 基础圆角</strong><p class="meta">工具卡、图标按钮、提示条</p><div class="track"><i></i></div></article><article class="sample r10" data-od-id="panel-card"><strong>10px 面板圆角</strong><p class="meta">筛选容器、编辑工具条</p></article><article class="sample r12" data-od-id="dialog-card"><strong>12px 对话框圆角</strong><p class="meta">高风险操作的唯一提升层级</p></article></section></main></body></html>
