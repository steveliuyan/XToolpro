<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>组件表面</title><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body)}main{max-width:850px;margin:auto;padding:36px 20px}h1{font:690 30px/1.15 var(--font-display)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:24px}.card{min-height:150px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}.card:hover{border-color:var(--accent);background:var(--accent-soft)}.symbol{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--accent-icon);color:var(--accent);font-weight:700}.meta{margin-top:6px;color:var(--muted);font:12px var(--font-mono)}.setting{display:flex;justify-content:space-between;align-items:center;min-height:64px;border-top:1px solid var(--border)}.switch{width:52px;height:32px;border:1px solid color-mix(in oklch,var(--accent) 55%,var(--surface));border-radius:20px;background:var(--surface);position:relative}.switch:after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--accent);box-shadow:0 1px 3px color-mix(in oklch,var(--fg) 18%,transparent)}button:focus-visible,.card:focus-visible{outline:3px solid color-mix(in oklch,var(--accent) 35%,transparent);outline-offset:2px}</style></head><body><main data-od-id="surface-preview"><p class="meta">SURFACE / COMPONENT REVIEW</p><h1 data-od-id="surface-title">边界、圆角与触控反馈</h1><section class="grid" data-od-id="surface-cards"><button class="card" style="text-align:left"><span class="symbol">图</span><strong style="display:block;margin-top:14px">图片批处理</strong><span class="meta">压缩、转换与导出</span></button><div class="card"><div class="setting"><span><strong>后台任务通知</strong><small class="meta" style="display:block">显示下载、扫描和导出进度</small></span><span class="switch" aria-label="已开启"></span></div></div><div class="card" style="box-shadow:var(--shadow)"><strong>恢复默认布局？</strong><p class="meta">确认类表面仅在高风险操作中使用投影。</p></div></section></main></body></html>
