<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>主色预览</title><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body)}main{max-width:720px;margin:auto;padding:36px 20px}h1{font:690 30px/1.15 var(--font-display)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:24px}.swatch{height:130px;padding:14px;display:flex;align-items:end;border:1px solid var(--border);border-radius:var(--radius);font:12px var(--font-mono)}.accent{background:var(--accent);color:var(--surface)}.soft{background:var(--accent-soft);color:var(--fg)}.icon{background:var(--accent-icon);color:var(--accent)}</style></head><body><main data-od-id="primary-color-preview"><p>COLOR / PRIMARY</p><h1 data-od-id="primary-color-title">天空蓝主色</h1><p>同一主色在可执行、选中、连接和进行中状态中保持一致，表面明度负责层级。</p><section class="grid" data-od-id="primary-accent-swatches"><div class="swatch accent">--accent · 主要操作</div><div class="swatch soft">--accent-soft · 悬停表面</div><div class="swatch icon">--accent-icon · 图标底</div></section></main></body></html>
