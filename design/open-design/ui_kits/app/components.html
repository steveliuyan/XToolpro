<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>XToolpro 组件索引</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="components/kit.css">
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: var(--canvas); color: var(--text-primary); font: 14px/1.45 var(--font-body); } main { max-width: 920px; margin: auto; padding: 40px 20px; } h1 { margin: 0; font: 690 30px/1.15 var(--font-display); } h2 { margin: 0; font: 670 17px/1.25 var(--font-display); } .meta { color: var(--text-secondary); font: 12px/1.4 var(--font-mono); } .head { display:flex; align-items:center; justify-content:space-between; gap:12px; } .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-top: 24px; } .card { min-height: 150px; padding: 16px; border: 1px solid var(--border-subtle); border-radius: var(--radius); background: var(--surface-raised); } .symbol { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 8px; background: var(--surface-selected); color: var(--action-primary); font-weight: 700; } .status { display: flex; align-items: center; gap: 8px; margin-top: 16px; } .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--status-success); } .progress { height: 5px; margin-top: 10px; overflow: hidden; border-radius: 99px; background: var(--progress-track); } .progress i { display: block; width: 56%; height: 100%; background: var(--status-progress); } a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 28px; color: var(--action-primary); font-weight: 670; text-decoration: none; } a:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
  </style>
</head>
<body><main data-od-id="component-catalog"><div class="head"><div><p class="meta">XTOOLPRO / COMPONENT CATALOG</p><h1 data-od-id="component-catalog-title">应用组件索引</h1></div><button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">深色</button></div><p class="meta">每个组件在应用套件中以可操作状态呈现。</p><section class="grid" data-od-id="component-cards"><article class="card" data-od-id="component-card-tool"><span class="symbol">图</span><h2 style="margin-top:12px">工具卡</h2><p class="meta">34px 图标底、名称与任务导向短描述。</p></article><article class="card" data-od-id="component-card-task"><span class="symbol">下</span><h2 style="margin-top:12px">任务行</h2><p class="meta">下载中 · 720p MP4 · 56%</p><div class="progress"><i></i></div></article><article class="card" data-od-id="component-card-status"><h2>状态组合</h2><div class="status"><span class="dot"></span><strong>VPN 已连接</strong></div><p class="meta">颜色与状态文字同时出现。</p></article><article class="card" data-od-id="component-card-setting"><span class="symbol">铃</span><h2 style="margin-top:12px">设置项</h2><p class="meta">64px 连续列表行，含简短说明与明确去向。</p></article></section><a href="index.html" data-od-id="app-kit-link">打开可操作的应用组件套件</a></main><script src="components/behaviors.js"></script><script>XToolproKit.restoreTheme(); document.querySelector('[data-theme-toggle]').addEventListener('click', () => XToolproKit.setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));</script></body>
</html>
